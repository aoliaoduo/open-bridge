# Without this file GitHub keeps an "Open a blank issue" link next to the
# templates, and a blank issue is how a report arrives with no version, no
# exposure level and no pasted output — the three things the bug template
# exists to collect.
#
# blank_issues_enabled: false does not block anyone. It removes the path of
# least resistance, which is what a template competes with.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/aoliaoduo/open-bridge/security/advisories/new
    about: >-
      Anything that lets someone other than the operator reach the workspace,
      or exposes a secret the masking should have covered. Advisories are
      private; an issue is not.
  - name: Conventions for changing this repo
    url: https://github.com/aoliaoduo/open-bridge/blob/main/AGENTS.md
    about: >-
      Before opening an issue about something that looks wrong in the code,
      check whether it is a documented convention.
