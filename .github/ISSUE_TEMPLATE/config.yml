# Use templates for ordinary reports; report vulnerabilities privately below.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/aoliaoduo/open-bridge/security/advisories/new
    about: >-
      Anything that lets someone other than the operator reach the workspace,
      or exposes a secret the masking should have covered. Advisories are
      private; an issue is not.
  - name: Contributing to this repo
    url: https://github.com/aoliaoduo/open-bridge/blob/main/CONTRIBUTING.md
    about: >-
      Contributor setup, validation and pull-request guidance. Ordinary bug
      reports do not require learning the implementation rules first.
