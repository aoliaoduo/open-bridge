name: CI

# Every push to main used to spend ~4 minutes across three runners, including
# pushes that only touched prose. The paths-ignore list skips those: a
# CHANGELOG or README edit cannot break a build, and waiting on a matrix to
# confirm that slows the loop for no information.
#
# Deliberately a denylist, not an allowlist. A new source directory added
# later is covered by default; forgetting to add it to an allowlist would
# quietly leave real code untested, which is the expensive direction of the
# mistake. AGENTS.md and the workflow itself are NOT ignored -- they change
# how the build behaves.
#
# workflow_dispatch stays, so a docs-only commit can still be verified on
# demand from the Actions tab when it matters (a release, say).
on:
  push:
    branches: [main]
    # `paths` with negative patterns, NOT `paths-ignore`: paths-ignore has no
    # exceptions -- a "!AGENTS.md" line there is read as a literal filename and
    # silently does nothing, which would have let AGENTS.md changes skip CI.
    # Order matters; later patterns win.
    paths:
      - "**"
      - "!**/*.md"
      - "!LICENSE"
      - "!.gitignore"
      # Markdown that DOES change behaviour: AGENTS.md is injected into every
      # session's instructions, and docs/tools.md is the tool contract.
      - "AGENTS.md"
      - "docs/tools.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported runtime (package.json engines: >=22.0.0).
          # Node 20 left maintenance in March 2026, so it is no longer a
          # supported floor for a tool that ships without a security net.
          - os: ubuntu-latest
            node: "22.x"
          # Current runtime used for local development.
          - os: ubuntu-latest
            node: "24.x"
          # Primary target platform (Git Bash shell, bundled ripgrep).
          - os: windows-latest
            node: "24.x"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build must precede the integration test: it boots bin/open-bridge.js,
      # which loads the compiled dist/ output.
      - name: Build
        run: npm run build

      - name: Test (unit + API integration)
        run: npm test

      - name: CLI smoke test
        shell: bash
        run: |
          node bin/open-bridge.js version
          node bin/open-bridge.js doctor
          node bin/open-bridge.js status
