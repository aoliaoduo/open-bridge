name: CI

# Current documentation has executable contracts: relative/source references
# must resolve and connection examples must not contain live credentials.
# Do not skip those checks merely because a change only touches Markdown.
# Release history, conduct text and the license remain prose-only exceptions;
# manual runs are still available for release verification.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!CHANGELOG.md"
      - "!CODE_OF_CONDUCT.md"
      - "!LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported runtime (package.json engines: >=22.0.0).
          # Keep a runner at the declared engine floor, not just the version
          # currently installed on a maintainer's machine.
          - os: ubuntu-latest
            node: "22.x"
          # Current runtime used for local development.
          - os: ubuntu-latest
            node: "24.x"
          # Primary target platform (Git Bash shell, bundled ripgrep).
          - os: windows-latest
            node: "24.x"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build must precede the integration test: it boots bin/open-bridge.js,
      # which loads the compiled dist/ output.
      - name: Build
        run: npm run build

      - name: Test (core, integration and UI)
        run: npm test

      - name: Package preflight
        run: npm run package:check

      - name: CLI smoke test
        shell: bash
        run: |
          node bin/open-bridge.js version
          node bin/open-bridge.js doctor
          node bin/open-bridge.js status
