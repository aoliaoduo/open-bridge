<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Open Bridge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-top">
      <div class="brand"><span class="brand-dot"></span><span class="brand-name">Open Bridge</span></div>
      <button id="collapseBtn" class="icon-btn" title="收起侧栏">
        <svg viewBox="0 0 16 16"><path d="M6 3l-4 5 4 5M2 8h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <nav class="sb-nav">
      <div class="nav-label">主</div>
      <button class="nav-item active" data-view="home" title="总览">
        <svg viewBox="0 0 16 16"><path d="M2 8l6-5 6 5M4 7.5V13h8V7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>总览</span>
      </button>
      <button class="nav-item" data-view="feed" title="活动实况">
        <svg viewBox="0 0 16 16"><path d="M2 8h3l2-5 3 10 2-5h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>活动实况</span>
      </button>
      <button class="nav-item" data-view="tools" title="工具目录">
        <svg viewBox="0 0 16 16"><path d="M7 2H2v5h5V2zm7 0H9v5h5V2zM7 9H2v5h5V9zm7 0H9v5h5V9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>工具目录</span>
      </button>
      <button class="nav-item disabled" disabled title="审批中心（B1：等桥侧审批 API）">
        <svg viewBox="0 0 16 16"><path d="M8 2L3 4v4c0 3 2 5 5 6 3-1 5-3 5-6V4L8 2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 8l1.5 1.5L10.5 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>审批中心</span><em class="tag">B1</em>
      </button>
    </nav>

    <nav class="sb-nav">
      <div class="nav-label">系统</div>
      <button id="navConsole" class="nav-item" title="打开控制台窗口">
        <svg viewBox="0 0 16 16"><path d="M3 4l3 4-3 4m4 0h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>控制台</span>
      </button>
      <button id="navLog" class="nav-item" title="在文件夹中显示日志">
        <svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4V2zm5 0v3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>日志文件</span>
      </button>
    </nav>

    <div class="sb-spacer"></div>

    <div class="ws-mini">
      <div class="nav-label">当前工作区</div>
      <div class="ws-path mono" id="wsPath" title="">…</div>
      <div class="ws-actions">
        <button id="wsChange" class="mini-btn">更换…</button>
        <button id="wsOpen" class="mini-btn">打开</button>
      </div>
    </div>

    <div class="sb-foot">
      <button id="themeToggle" class="icon-btn" title="切换明暗主题">
        <svg class="ic-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="ic-moon" viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 016.5 2.5a5.5 5.5 0 107 7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
      <span class="foot-text" id="footVersion">v1.0.0-beta.2</span>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="crumb" id="crumb">总览</div>
      <div class="spacer"></div>
      <div class="status-pill" id="topStatus"><span class="dot"></span><span class="txt">检查中…</span></div>
    </header>

    <section id="viewHome" class="view">
      <div class="hero card">
        <div class="hero-left">
          <div class="hero-dot" id="heroDot"></div>
          <div>
            <div class="hero-state" id="heroState">检查中…</div>
            <div class="hero-sub" id="heroSub">正在连接本地桥</div>
          </div>
        </div>
        <div class="hero-actions">
          <button id="btnConsoleHome" class="btn">打开控制台</button>
          <button id="btnRestart" class="btn ghost" title="重启本地桥">重启桥</button>
        </div>
      </div>

      <div class="home-grid">
        <div class="card" id="urlCard">
          <div class="card-head">
            <span class="card-title">连接器 URL</span>
            <span class="card-sub">含路由令牌，等同账号密码</span>
            <div class="spacer"></div>
            <button id="maskToggle" class="mini-btn">显示</button>
          </div>
          <div class="url-row" id="rowPublic" hidden>
            <div class="url-label">公网<br><i>网页 AI 用这条</i></div>
            <div class="url-value mono masked" id="urlPublic">—</div>
            <button class="copy-btn" data-target="urlPublic">复制</button>
          </div>
          <div class="url-row" id="rowLoop">
            <div class="url-label">本机回环<br><i>同机客户端用</i></div>
            <div class="url-value mono masked" id="urlLoop">—</div>
            <button class="copy-btn" data-target="urlLoop">复制</button>
          </div>
          <div class="url-note" id="tunnelNote" hidden>
            公网隧道未启动——网页 AI 暂时到不了本机。<button id="openConsoleFromNote" class="link-btn">打开控制台配置隧道 →</button>
          </div>
        </div>

        <div class="card" id="statCard">
          <div class="card-head"><span class="card-title">一眼看桥</span></div>
          <div class="stat-grid">
            <div class="stat"><div class="stat-num" id="statTools">—</div><div class="stat-name">可用工具</div></div>
            <div class="stat"><div class="stat-num" id="statActivity">—</div><div class="stat-name">最近活动缓存</div></div>
            <div class="stat"><div class="stat-num mono small-num" id="statPort">—</div><div class="stat-name">端口</div></div>
            <div class="stat"><div class="stat-num small-num" id="statMode">—</div><div class="stat-name">运行模式</div></div>
          </div>
          <div class="stat-foot mono" id="statLog" title="">日志：—</div>
        </div>
      </div>
    </section>

    <section id="viewFeed" class="view" hidden>
      <div class="feed-bar">
        <div class="search-wrap">
          <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="feedSearch" type="search" placeholder="搜索工具名或消息…（/ 聚焦）">
        </div>
        <div class="chip-row" id="feedFilters">
          <button class="chip on" data-f="all">全部</button>
          <button class="chip" data-f="running">进行中</button>
          <button class="chip" data-f="completed">成功</button>
          <button class="chip" data-f="warning">警告</button>
          <button class="chip" data-f="error">失败</button>
        </div>
        <div class="spacer"></div>
        <label class="opt"><input type="checkbox" id="autoScroll" checked> 自动滚动</label>
        <button id="feedPause" class="mini-btn">暂停</button>
        <button id="feedClear" class="mini-btn">清空视图</button>
      </div>
      <div id="feedMeta" class="feed-meta">等待第一条活动…</div>
      <div id="feed" class="feed"></div>
    </section>

    <section id="viewTools" class="view" hidden>
      <div class="feed-bar">
        <div class="search-wrap">
          <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="toolSearch" type="search" placeholder="搜索工具名或描述…">
        </div>
        <div class="spacer"></div>
        <span class="muted" id="toolsCount"></span>
        <button id="toolsReload" class="mini-btn">刷新</button>
      </div>
      <div id="toolsState" class="tools-state">首次进入时加载工具清单…</div>
      <div id="tools" class="tools"></div>
    </section>
  </main>

  <div id="toasts"></div>
</div>
<script src="app.js"></script>
</body>
</html>
